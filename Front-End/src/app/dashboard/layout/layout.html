<div class="dashboard">
  <!-- Overlay para cerrar menú en móvil -->
  <div class="overlay" [class.open]="menuOpen" (click)="menuOpen = false"></div>

  <!-- Sidebar mejorado -->
  <aside class="sidebar" [class.open]="menuOpen">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">🐾</span>
        <h2>PetApp</h2>
      </div>
      <button class="close-btn" (click)="menuOpen = false">✕</button>
    </div>

    <nav class="nav-menu">
      <!-- Inicio -->
      <a (click)="irAHome()" [class.active]="rutaActiva('home')">
        <span class="nav-icon">🏠</span>
        <span>Inicio</span>
      </a>

      <!-- Mascotas (lista) -->
      <a (click)="irAMascotas()" [class.active]="rutaActiva('mis-mascotas')">
        <span class="nav-icon">🐾</span>
        <span>Mis Mascotas</span>
      </a>

      <!-- Reportes (lista) -->
      <a (click)="irAMisReportes()" [class.active]="rutaActiva('mis-reportes')">
        <span class="nav-icon">📊</span>
        <span>Mis Reportes</span>
      </a>


      <!-- Botones adicionales (acciones rápidas) - opcionales -->
      <div class="divider"></div>


    </nav>
  </aside>

  <!-- Main content -->
  <main class="content">
    <header class="top-bar"></header>
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
