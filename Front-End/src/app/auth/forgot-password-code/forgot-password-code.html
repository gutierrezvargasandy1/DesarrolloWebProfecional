<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <div class="icon-big">🔐</div>
      <h1>PetFinder</h1>
      <p>Verifica tu código 🐶</p>
    </div>

    <div class="info-message">
      <span>✉️</span> Hemos enviado un código de verificación a:<br/>
      <strong>{{ email }}</strong>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">

      <div class="input-group" [class.invalid]="code.invalid && code.touched">
        <label for="code">
          <span>🔢</span> Código de verificación
        </label>

        <input
          type="text"
          id="code"
          formControlName="code"
          placeholder="Ej: ABC123"
          autocomplete="off"
          maxlength="6"
          style="text-transform: uppercase; text-align: center; font-size: 1.2rem; letter-spacing: 4px;"
        />

        <div class="error-message" *ngIf="code.invalid && code.touched">
          ⚠️ <span>{{ getCodeError() }}</span>
        </div>
      </div>

      <div class="error-message-global" *ngIf="errorMessage">
        ❌ <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="btn-login" [disabled]="form.invalid || isLoading">
        <span *ngIf="!isLoading">✅ Verificar código</span>
        <span *ngIf="isLoading">⏳ Verificando...</span>
      </button>

      <div class="extra-links">
        <a href="javascript:void(0)" (click)="resendCode()" [class.disabled]="isLoading">
          🔄 Reenviar código
        </a>
        <a href="javascript:void(0)" (click)="goBack()">
          ⬅️ Volver
        </a>
      </div>

    </form>
  </div>
</div>
