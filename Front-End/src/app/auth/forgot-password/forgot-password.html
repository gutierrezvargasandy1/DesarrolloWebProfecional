<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <div class="icon-big">🐾</div>
      <h1>PetFinder</h1>
      <p>Recupera tu contraseña 🐶</p>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">

      <div class="input-group" [class.invalid]="form.get('email')?.invalid && form.get('email')?.touched">
        <label for="email">
          <span>📧</span> Correo electrónico
        </label>

        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="ejemplo@gmail.com"
          autocomplete="email"
        />

        <div class="error-message" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          ⚠️ <span>{{ getEmailError() }}</span>
        </div>
      </div>

      <!-- Mensaje de error global -->
      <div class="error-message-global" *ngIf="errorMessage">
        ❌ {{ errorMessage }}
      </div>

      <!-- Botón con estado de carga -->
      <button type="submit" class="btn-login" [disabled]="form.invalid || isLoading">
        <span *ngIf="!isLoading">🐾 Enviar enlace de recuperación</span>
        <span *ngIf="isLoading">⏳ Enviando...</span>
      </button>

      <div class="extra-links">
        <a routerLink="/auth/login">⬅️ Volver al inicio de sesión</a>
      </div>

    </form>
  </div>
</div>
