<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <div class="icon-big">🐾</div>
      <h1>PetConnect</h1>
      <p>Tu comunidad de mascotas</p>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <!-- Campo email -->
      <div class="input-group" [class.invalid]="hasError('correo')">
        <label for="correo">
          <span>📧</span> Correo electrónico
        </label>
        <input
          type="correo"
          id="correo"
          formControlName="correo"
          placeholder="ejemplo@correo.com"
          autocomplete="correo"
        />
        <div class="error-message" *ngIf="hasError('correo')">
          ⚠️ {{ getError('correo') }}
        </div>
      </div>

      <!-- Campo password -->
      <div class="input-group" [class.invalid]="hasError('password')">
        <label for="password">
          <span>🔒</span> Contraseña
        </label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Mínimo 6 caracteres"
          autocomplete="current-password"
        />
        <div class="error-message" *ngIf="hasError('password')">
          ⚠️ {{ getError('password') }}
        </div>
      </div>

      <!-- Botón con estado de carga -->
      <button type="submit" class="btn-login" [disabled]="isLoading">
        <span *ngIf="!isLoading">🐾 Iniciar Sesión</span>
        <span *ngIf="isLoading">⏳ Cargando...</span>
      </button>

      <!-- Enlaces adicionales -->
      <div class="extra-links">
        <a routerLink="/auth/forget-password">🐶 ¿Olvidaste tu contraseña?</a>
        <a routerLink="/auth/register">🐱 Crear cuenta nueva</a>
      </div>
    </form>

    <!-- Mensaje global (se muestra solo cuando hay texto) -->
    <div class="global-message" [class.show]="globalMsg">
      {{ globalMsg }}
    </div>
  </div>
</div>
